name: Build PubChemQC FCIDUMPs

# Each source file from a PubChemQC B3LYP/6-31G* subset (MolSSI Hugging Face mirror; chon300nosalt or
# chnopsfcl300nosalt) is streamed once (prep), its small neutral singlets not already processed by an earlier build
# (skip list) are split into shards, and each shard is converted to CAS(8e,8o) FCIDUMPs on its own runner (build).
# shards=auto sizes each file's shard count to its candidate count so dense files finish inside the time budget.
on:
  workflow_dispatch:
    inputs:
      file_from: { description: 'First source file index (chon300nosalt 0-86, chnopsfcl300nosalt 0-148)', required: true, default: '9' }
      file_to:   { description: 'Last source file index, inclusive', required: true, default: '9' }
      shards:    { description: 'Runners per source file, or auto (ceil(candidates/per_shard))', required: true, default: '4' }
      maxorb:    { description: 'Max orbitals', required: true, default: '150' }
      limit:     { description: 'Molecules per shard (0 = all; for tests)', required: true, default: '0' }
      budget_min: { description: 'Stop starting new molecules after this many minutes (job limit 355 min; one molecule may take up to 120 min, so keep this <= 230)', required: true, default: '230' }
      subset:    { description: 'PubChemQC subset (b3lyp_pm6_<subset>)', required: true, default: 'chon300nosalt' }
      skip:      { description: 'Skip list of CIDs already processed (path in repo, empty = none)', required: false, default: '' }
      per_shard: { description: 'Candidates per shard when shards=auto (max 64 shards per file)', required: true, default: '500' }
      pool:      { description: 'Pooled mode: 0 = off (one prep job per file); N>0 = scan the files in up to 24 grouped prep jobs, pool all candidates (metal-free, single-fragment) and build them in N shards', required: true, default: '0' }

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.m.outputs.files }}
    steps:
      - id: m
        run: |
          python3 - <<'P' >> "$GITHUB_OUTPUT"
          import json
          a,b=int("${{ inputs.file_from }}"),int("${{ inputs.file_to }}")
          if "${{ inputs.pool }}"=="0": print("files="+json.dumps(list(range(a,b+1))))
          else:   # pooled mode: contiguous groups of files, at most 24 prep jobs
              n=b-a+1; g=min(24,n); k=-(-n//g); print("files="+json.dumps([f"{i}-{min(b,i+k-1)}" for i in range(a,b+1,k)]))
          P

  prep:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16   # leave runner slots (account limit 20) for other repos' workflows
      matrix: { file: '${{ fromJSON(needs.plan.outputs.files) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - if: ${{ inputs.pool == '0' }}
        run: python scripts/pcq_prep.py ${{ matrix.file }} ${{ inputs.shards }} ${{ inputs.maxorb }} ${{ inputs.limit }} ${{ inputs.subset }} "${{ inputs.skip }}" ${{ inputs.per_shard }} 64
      - if: ${{ inputs.pool != '0' }}
        env: { PCQ_ALLOW_Z: '1,5,6,7,8,9,14,15,16,17,35', PCQ_NO_MULTIFRAG: '1' }   # only elements pcq_convert.py accepts (H B C N O F Si P S Cl Br)
        run: |
          r="${{ matrix.file }}"
          python scripts/pcq_prep_group.py "${r%-*}" "${r#*-}" ${{ inputs.maxorb }} ${{ inputs.subset }} "${{ inputs.skip }}" 4
      - uses: actions/upload-artifact@v4
        with: { name: 'cand-${{ matrix.file }}', path: cand, retention-days: 7 }

  # one build cell per (file, shard), using the shard count each prep job chose
  cells:
    needs: prep
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.c.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'cand-*', path: cand }
      - if: ${{ inputs.pool != '0' }}
        run: python3 scripts/pcq_pool.py cand ${{ inputs.pool }} pool && rm -rf cand && mkdir -p cand/cand-pool && mv pool/* cand/cand-pool/
      - if: ${{ inputs.pool != '0' }}
        uses: actions/upload-artifact@v4
        with: { name: 'cand-pool', path: cand/cand-pool, retention-days: 30 }
      - id: c
        run: |
          python3 - <<'P' >> "$GITHUB_OUTPUT"
          import json, glob
          cells=[]
          for p in sorted(glob.glob('cand/cand-*/summary.json')):
              d=json.load(open(p)); cells+=[dict(file=d['index'],shard=k) for k,n in enumerate(d['shards']) if n>0]
          assert len(cells)<=256, f'{len(cells)} cells exceed the 256-job matrix limit; dispatch fewer files'
          print("cells="+json.dumps(cells))
          P

  build:
    needs: [plan, prep, cells]
    if: ${{ needs.cells.outputs.cells != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: { cell: '${{ fromJSON(needs.cells.outputs.cells) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: 'cand-${{ matrix.cell.file }}', path: cand }
      - name: Convert molecules
        env: { PCQ_OUT: out, STRICT_EXTERNAL: '1' }
        run: |
          export DEADLINE=$(( $(date +%s) + ${{ inputs.budget_min }} * 60 ))
          mkdir -p out/fcidump
          wc -l cand/shard${{ matrix.cell.shard }}.jsonl
          python scripts/pcq_run.py cand/shard${{ matrix.cell.shard }}.jsonl $(nproc)
          cp cand/summary.json out/source_summary.json
          echo "rows=$(wc -l < out/catalog.jsonl) ok=$(grep -c '"status": "ok"' out/catalog.jsonl || true)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'out-${{ matrix.cell.file }}-${{ matrix.cell.shard }}', path: out, retention-days: 30 }

  # Merge every shard's out/ into one tree and run the final re-check; the published library is uploaded
  # as one artifact ('library'), so nothing has to be assembled by hand before the shard artifacts expire.
  finalize:
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: 'out-*', path: shards }
      - name: Merge shards and finalize
        run: |
          python scripts/pcq_merge.py merged shards/out-*
          PCQ_DIR=merged PCQ_SUBSET=${{ inputs.subset }} python scripts/pcq_finalize.py
      - uses: actions/upload-artifact@v4
        with: { name: 'library', path: merged/library, retention-days: 90 }
      - uses: actions/upload-artifact@v4
        with: { name: 'merged-catalog', path: merged/catalog.jsonl, retention-days: 90 }
